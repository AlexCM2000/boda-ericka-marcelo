<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="1.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.2  0 0 0 0.32 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
